name: Sync Upstream Repository

on:
  schedule:
    # 每天北京时间 00:00 运行 (UTC 16:00)
    - cron: '0 16 * * *'
  
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync upstream repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/alenin-zhang/IPTV.git || true
          git remote set-url upstream https://github.com/alenin-zhang/IPTV.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream
        id: merge
        continue-on-error: true
        run: |
          git merge upstream/main --no-edit
          echo "merge_status=$?" >> $GITHUB_OUTPUT

      - name: Push changes
        if: steps.merge.outputs.merge_status == '0'
        run: git push origin main

      - name: Create Pull Request on conflict
        if: steps.merge.outputs.merge_status != '0'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Sync upstream repository'
          title: '[Auto] Sync upstream repository'
          body: |
            ## 自动同步上游仓库

            这是一个自动生成的 PR，用于同步上游仓库 `alenin-zhang/IPTV` 的最新更新。

            如果存在冲突，请手动解决冲突后合并此 PR。

            **操作步骤：**
            1. 查看变化
            2. 解决任何冲突（如果有）
            3. 合并此 PR
          branch: sync/upstream
          delete-branch: true
          labels: 'auto-sync, upstream'

      - name: Notify success
        if: steps.merge.outputs.merge_status == '0'
        run: echo "✅ 成功同步上游仓库！"

      - name: Notify conflict
        if: steps.merge.outputs.merge_status != '0'
        run: echo "⚠️ 检测到冲突，已创建 PR 供手动处理"
